# Railway.app — config de deploy do backend
# Railway detecta Dockerfile automaticamente (na raiz de apps/api ou via
# Root Directory no painel).

[build]
# Aponta pro Dockerfile do API (path dentro do repo)
dockerfilePath = "apps/api/Dockerfile"

[deploy]
# Health check (Railway espera 200 aqui)
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Variáveis de ambiente (configurar no painel Railway):
# - DATABASE_URL: string de conexao do Postgres (Railway provê via plugin)
# - JWT_SECRET: valor gerado por `openssl rand -base64 32`
# - CORS_ORIGINS: domínio do front em prod (ex: https://bunker.app)
# - BETTER_AUTH_URL: URL publica da API (ex: https://api.bunker.app)

# IMPORTANTE: rodar migrations na inicialização via release command:
#   pnpm --filter @bunker/api db:migrate && pnpm --filter @bunker/api db:seed
